<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebastiano Danesi | Digital Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212; /* Sfondo scuro per il body */
            --card-bg: #1e1e1e; /* Sfondo leggermente più chiaro per la card */
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #0082c9; /* Colore di accento (Blu stile Nextcloud) */
            --accent-hover: #006ba6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 40px 30px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            border: 1px solid #2a2a2a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(0, 130, 201, 0.2);
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .bio {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 16px 24px;
            border-radius: 14px; /* Stile più moderno rispetto ai bordi completamente tondi */
            width: 100%;
            transition: all 0.2s ease;
            margin-bottom: 30px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid #333;
            padding-top: 24px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background-color: #2a2a2a;
            color: var(--text-main);
            border-radius: 12px;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://cloud.frusca.duckdns.org/s/6LKaJHJ6sHzm5QP/download" alt="Sebastiano Danesi" class="profile-img">
        
        <h1 class="name">Sebastiano Danesi</h1>
        <h2 class="title">Accountant & IT Enthusiast</h2>
        
        <p class="bio">
            Benvenuto! Per salvare i miei recapiti direttamente nella tua rubrica, clicca sul pulsante qui sotto:
        </p>

        <a href="https://cloud.frusca.duckdns.org/s/L6obNMgfzMsLijG/download" class="btn-primary">
            <i class="fas fa-address-book"></i> SALVA NEI CONTATTI
        </a>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/sebastiano-danesi-160049123/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3B%2BISUGgyARDa7LOLm6n33dg%3D%3D" class="social-icon" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="mailto:sebastiano.danesi.serio@gmail.com" class="social-icon" title="Invia Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </div>

</body>
</html>
